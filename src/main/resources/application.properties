spring.application.name=easygit
server.port=8088

# 저장소들이 저장될 위치
easygit.data-dir=data/repos

# 한글 깨짐 방지
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# 실제 Gitea 연동 (로컬에 띄운 Gitea 서버에 프로젝트를 올림)
easygit.gitea.url=http://localhost:3000
easygit.gitea.user=easyadmin
easygit.gitea.token-file=${user.home}/gitea-data/token.txt
